# Enabling Animations (0: disable, 1: enable)
animations=1
layer_animations=1
animation_fade_in=1
animation_fade_out=1

# Animation Type (Available types: slide, zoom, fade, none.)
animation_type_open=slide
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade

# Fade Settings
fade_in_begin_opacity=1.0
fade_out_begin_opacity=1.0

# Zoom Settings
zoom_initial_ratio=0.8
zoom_end_ratio=0.8

# Durations (in milliseconds)
animation_duration_move=500
animation_duration_open=0
animation_duration_tag=800
animation_duration_close=s0
animation_duration_focus=0

# Bezier curves
animation_curve_open=0.05,0.7,0.1,1
animation_curve_move=0.40,1.0,0.06,1.0
animation_curve_tag=0.1,1,0,1
animation_curve_close=0.05,0.7,0.1,1
animation_curve_focus=0.46,1.0,0.29,0.99
animation_curve_opacity_fade_in=0.05,0.7,0.1,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5

# Tag Animation Direction (1: horizontal, 0: vertical)
tag_animation_direction = 1
