#scratchpads
bind=SUPER,k,toggle_named_scratchpad,none,kitty-scratchpad,kitty -T kitty-scratchpad
bind=SUPER,E,toggle_named_scratchpad,foot-yazi,none,footclient --app-id=foot-yazi -e yazi
bind=SUPER,B,toggle_named_scratchpad,foot-btop,none,footclient --app-id=foot-btop -e btop
bind=SUPER,N,toggle_named_scratchpad,obsidian,none,obsidian,obsidian
bind=SUPER,A,toggle_named_scratchpad,ai-scratchpad,none,firefox --name ai-scratchpad http://localhost:3000/
bind=SUPER,H,toggle_named_scratchpad,hermes-scratchpad,none,footclient --app-id=hermes-scratchpad -e hermes

# Keybinds
  bind=SUPER,F,togglemaximizescreen
  bind=SUPER,LEFT,focusdir,left
  bind=SUPER,DOWN,focusdir,down
  bind=SUPER,UP,focusdir,up
  bind=SUPER,RIGHT,focusdir,right
  bind=SUPER,O,toggleoverview

  bind=SUPER,Q,killclient
  bind=SUPER,R,spawn_shell,bash mmsg dispatch reload_config
  bind=SUPER,T,spawn,footclient
  bind=SUPER,U,viewtoleft,0

  #select randomwallpaper and set noctalia colorscheme
  bind=SUPER+SHIFT,W,spawn,~/.config/scripts/random_wallpaper.sh
  bind=SUPER+CTRL,w,spawn,noctalia msg panel-toggle wallpaper

  bind=SUPER,Delete,spawn_shell,cliphist wipe
  bind=SUPER,Return,spawn,footclient
  bind=SUPER+CTRL,E,quit
  bindr=Super,Super_L,spawn,vicinae toggle
  # bindr=Super,Super_L,spawn,noctalia msg panel-toggle launcher
  bind=SUPER,TAB,switch_layout
  bindl=SUPER+SHIFT,S,spawn,bash $HOME/.config/scripts/full_screenshot.sh
  bindl=SUPER+CTRL,S,spawn_shell,killall orca || orca


  bind=ALT,F,togglefullscreen
  bind=ALT,M,togglefakefullscreen
  bind=ALT,G,spawn_shell,pkill nwg-look || nwg-look

  bindl=ALT,Period,spawn, bash $HOME/.config/scripts/full_screenshot.sh
  bindl=ALT,Comma,spawn, bash $HOME/.config/scripts/partial_screenshot.sh 

  bind=SUPER,1,spawn_shell,mmsg dispatch viewcrossmon,1,DP-1 && mmsg dispatch focusmon,DP-1
  bind=SUPER,2,spawn_shell,mmsg dispatch viewcrossmon,2,DP-1 && mmsg dispatch focusmon,DP-1
  bind=SUPER,3,spawn_shell,mmsg dispatch viewcrossmon,3,DP-1 && mmsg dispatch focusmon,DP-1
  bind=SUPER,4,spawn_shell,mmsg dispatch viewcrossmon,4,DP-1 && mmsg dispatch focusmon,DP-1
  bind=SUPER,5,spawn_shell,mmsg dispatch viewcrossmon,5,DP-1 && mmsg dispatch focusmon,DP-1
  bind=SUPER,6,spawn_shell,mmsg dispatch viewcrossmon,6,DP-2 && mmsg dispatch focusmon,DP-2
  bind=SUPER,7,spawn_shell,mmsg dispatch viewcrossmon,7,DP-2 && mmsg dispatch focusmon,DP-2
  bind=SUPER,8,spawn_shell,mmsg dispatch viewcrossmon,8,DP-2 && mmsg dispatch focusmon,DP-2
  bind=SUPER,9,spawn_shell,mmsg dispatch viewcrossmon,9,DP-2 && mmsg dispatch focusmon,DP-2
  bind=SUPER,0,spawn_shell,mmsg dispatch viewcrossmon,0,DP-2 && mmsg dispatch focusmon,DP-2

# MouseBindings
  axisbind=SUPER,UP,viewtoleft,0
  axisbind=SUPER,DOWN,viewtoright,0
  mousebind=SUPER, btn_left, moveresize, curmove
  mousebind=SUPER, btn_right, moveresize, curresize

bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right

# Move windows to workspace
  bind=SUPER+SHIFT,1,tagsilent,1
  bind=SUPER+SHIFT,2,tagsilent,2
  bind=SUPER+SHIFT,3,tagsilent,3
  bind=SUPER+SHIFT,4,tagsilent,4
  bind=SUPER+SHIFT,5,tagsilent,5
  bind=SUPER+SHIFT,6,tagsilent,6
  bind=SUPER+SHIFT,7,tagsilent,7
  bind=SUPER+SHIFT,8,tagsilent,8
  bind=SUPER+SHIFT,9,tagsilent,9
  bind=SUPER+SHIFT,0,tagsilent,0

# # Laptop multimedia keys for volume and LCD brightness
  bind = NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1.2 @DEFAULT_AUDIO_SINK@ 10%+ && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
  bind = NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%- && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
  bind = NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
  bind = NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
  bind = NONE,XF86MonBrightnessUp,spawn,brightnessctl s 10%+
  bind = NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-

# swap window
  bind=SUPER+SHIFT,Up,exchange_client,up
  bind=SUPER+SHIFT,Down,exchange_client,down
  bind=SUPER+SHIFT,Left,exchange_client,left
  bind=SUPER+SHIFT,Right,exchange_client,right

  bind=SUPER+SHIFT,K,exchange_client,up
  bind=SUPER+SHIFT,J,exchange_client,down
  bind=SUPER+SHIFT,H,exchange_client,left
  bind=SUPER+SHIFT,L,exchange_client,right

# movewin
  bind=SUPER+ALT,Up,movewin,+0,-50
  bind=SUPER+ALT,Down,movewin,+0,+50
  bind=SUPER+ALT,Left,movewin,-50,+0
  bind=SUPER+ALT,Right,movewin,+50,+0

  bind=SUPER+ALT,K,movewin,+0,-50
  bind=SUPER+ALT,J,movewin,+0,+50
  bind=SUPER+ALT,H,movewin,-50,+0
  bind=SUPER+ALT,L,movewin,+50,+0

# resizewin
  bind=SUPER+CTRL,Up,resizewin,+0,-50
  bind=SUPER+CTRL,Down,resizewin,+0,+50
  bind=SUPER+CTRL,Left,resizewin,-50,+0
  bind=SUPER+CTRL,Right,resizewin,+50,+0

# switch window status
  bind=ALT,U,minimized,
  bind=ALT,I,restore_minimized
  bind=ALT,space,toggle_scratchpad

# tag switch
  bind=SUPER,up,viewtoleft,0
  bind=ALT,up,viewtoleft_have_client,0
  bind=SUPER,down,viewtoright,0
  bind=ALT,down,viewtoright_have_client,0

bind=SUPER,Left,viewtoleft,1
bind=SUPER,Right,viewtoright,1

#lock scrreen
bind=CTRL+SUPER,L,spawn, noctalia msg session lock

#screenshot selected area
bind=NONE,Print,spawn_shell,f=$HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png && grim -g "$(slurp)" "$f" && satty --filename "$f"