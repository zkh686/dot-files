# Border settings
border_radius=0
no_border_when_single=1

# Overview settings
enable_hotarea=0
hotarea_size=10
hotarea_corner=0
overview_gap_inner=10
overview_gap_outer=10

# Keyboard related
repeat_rate=20
repeat_delay=300
numlock_on=0
xkb_rules_layout=us

# Touchpad settings
disable_trackpad=0
tap_and_drag=1
trackpad_natural_scrolling=1
trackpad_accel_profile=2
trackpad_accel_speed=1.0
swipe_min_threshold=1
trackpad_scroll_factor=2.0

# Mouse Settings
mouse_natural_scrolling=0
mouse_accel_profile=2
mouse_accel_speed=1.0
axis_scroll_factor=2.0

# Focus & Input
drag_tile_to_tile=1
warp_cursor=1
cursor_hide_timeout=5
drag_corner=0
focus_on_activate=1
sloppy_focus=1

# Cursor Theme
cursor_theme=Bibata-Modern-Classic
cursor_size=32

# Theming
border_px=3
gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=10
gap_outer_vertical=10
focused_opacity=0.9

root_color=0x201b14ff
maximized_screen_color=0xffffffff
urgent_color=0xad401fff
global_color=0xb153a7ff
scratchpad_color=0x516c93ff
overlay_color=0x14a57cff
focus_color=0xffffffff
border_color=0x44444400
view_current_to_back=1