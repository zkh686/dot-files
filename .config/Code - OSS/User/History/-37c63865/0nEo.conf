# Setup XDG for screen sharing and start waypaper and waybar
exec-once = ~/.config/hypr/scripts/xdg.sh

# Start Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Load Wallpaper
exec-once = ~/.config/hypr/scripts/wallpaper-restore.sh

# Load Notification Daemon
exec-once = swaync

# Load GTK settings
exec-once = ~/.config/scripts/gtk.sh

# Using hypridle to start hyprlock
exec-once = hypridle

# Load cliphist history
exec-once = wl-paste --watch cliphist store


# Start autostart cleanup
exec-once = ~/.config/scripts/cleanup.sh

#exec = wlsunset -l 40.8 -L 83.8
exec-once = hyprpm reload

#conky kinda just works now
#using a script with sleep to ensure conky launches on correct monitor
exec-once=~/.config/scripts/conky.sh

exec-once = vicinae server &

#bar
#exec-once = ~/.config/waybar/launch.sh &
#exec-once = dms run &
# exec-once = /usr/bin/pypr
exec-once = hyprscratch init
exec-once = DMS_DANKBAR_LAYER=overlay dms run &
