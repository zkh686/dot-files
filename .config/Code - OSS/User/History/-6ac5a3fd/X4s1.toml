[pyprland]
plugins = [
    "scratchpads",
    "monitors"
]

[scratchpads.term]
animation = "fromTop"
command = "kitty --class kitty-dropterm"
class = "kitty-dropterm"
size = "75% 60%"
unfocus = "hide"

[scratchpads.calc]
animation = "fromRight"
command = "gnome-calculator"
class = "org.gnome.Calculator"
size = "25% 40%"
lazy = true

