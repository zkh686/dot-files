[pyprland]
plugins = [
  "scratchpads",
  "monitors",
  "expose",
  "shift_monitors",A
  "workspaces_follow_focus",
]

[monitors.placement]
"Acer".top_center_of = "Sony"

[workspaces_follow_focus]
max_workspaces = 9

[expose]
include_special = false

[scratchpads.stb]
animation = "fromBottom"
command = "kitty --class kitty-stb sstb"
class = "kitty-stb"
lazy = true
size = "75% 45%"

[scratchpads.stb-logs]
animation = "fromTop"
command = "kitty --class kitty-stb-logs stbLog"
class = "kitty-stb-logs"
lazy = true
size = "75% 40%"

[scratchpads.term]
animation = "fromTop"
command = "wezterm"
class = "wezterm"
size = "75% 60%"
position = "50% 0%"
multi = false

[scratchpads.volume]
animation = "fromRight"
command = "pavucontrol"
class = "org.pulseaudio.pavucontrol"
lazy = true
size = "40% 90%"
unfocus = "hide"

[scratchpads.btop]
animation = "fromTop"
command = "foot -e btop"
class = "foot-btop"
size = "75% 60%"

[scratchpads.yazi]
animation = "fromTop"
command = "foot -e yazi"
class = "foot-yazi"
size = "75% 60%"

[scratchpads.term_quake]
command = "wezterm start --class term_quake"
position = "0% 0%"
size = "50% 50%"
class = "term_quake"

[scratchpads.ai]
animation = "fromTop"
command = "firefox  -new-tab 'http://localhost:3000/'"
class = "ai"
size = "75% 60%"