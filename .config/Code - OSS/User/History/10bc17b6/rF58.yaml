    version: '3.3'
    services:
      searxng:
        container_name: searxng
        image: searxng/searxng:latest
        ports:
          - "8080:8080" # Map host port 8080 to container port 8080
        volumes:
          - ./searxng:/etc/searxng:rw # Mount a local directory for configuration persistence
        restart: unless-stopped
        cap_drop:
          - ALL
        cap_add:
          - CHOWN
          - SETGID
          - SETUID
          - DAC_OVERRIDE
        logging:
          driver: "json-file"
          options:
            max-size: "1m"
            max-file: "1"