version: '3'
services:
  searxng:
    image: searxng/searxng
    restart: always
    ports:
      - "8888:8888"
    environment:
      - SEARXNG_WEB_BIND=0.0.0.0:8888
      - SEARXNG_DEFAULT_SEARCH_ENGINE=duckduckgo
      - SEARXNG_PRIVATE=false
      # Add any other necessary environment variables here
    volumes:
      - searxng-data:/var/lib/searxng

volumes:
  searxng-data: