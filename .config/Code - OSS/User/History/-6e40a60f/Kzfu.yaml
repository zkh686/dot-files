model: ollama:deepseek-coder-v2

clients:
  # Define the client for Ollama
  - type: openai-compatible
    name: ollama
    # Default API base URL for Ollama
    api_base: http://localhost:11434/v1 
    models:
      # List the specific model you want to use
      - name: deepseek-coder-v2 
        # Adjust max_input_tokens based on your specific model variant (e.g., 16b-lite, 32b)
        max_input_tokens: 131072 
        supports_reasoning: true 
      # You can add other Ollama models here if needed, such as for RAG embeddings
      # - name: nomic-embed-text 
      #   type: embedding
      #   max_tokens_per_chunk: 8192
      #   default_chunk_size: 1000
      #   max_batch_size: 50