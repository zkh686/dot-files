version: '3'
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: freshrss
      POSTGRES_PASSWORD: password
      POSTGRES_DB: freshrss
    volumes:
      - db-data:/var/lib/postgresql/data

  freshrss:
    image: fritsch/freshrss:latest
    depends_on:
      - db
    environment:
      - DB_ADAPTER=pgsql
      - DB_HOST=db
      - DB_USER=freshrss
      - DB_PASSWORD=password
      - DB_NAME=freshrss
    ports:
      - "8080:80"
    volumes:
      - freshrss-data:/var/www/FreshRSS/data

volumes:
  db-data:
  freshrss-data: