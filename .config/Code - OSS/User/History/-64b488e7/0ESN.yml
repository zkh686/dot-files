    volumes:
      # This volume persists your models and data
      - ollama:/root/.ollama
    ports:
      # Exposes the Ollama API on port 11434 of your host
      - "11434:11434"
    environment:
      # Optional: May be needed for certain GPUs (e.g., gfx1031 for RX 6750 XT)
      # Check AMD documentation for your specific GPU's GFX version
      # HSA_OVERRIDE_GFX_VERSION: "10.3.0"
      # HCC_AMDGPU_TARGET: "gfx1031"
    # Set the user to root if you encounter permission issues with the devices
    # user: root

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    restart: always
    depends_on:
      - ollama
    ports:
      # Exposes the Open WebUI on port 3000 of your host
      - "3000:8080"
    volumes:
      # This volume persists your chat history and settings
      - open-webui:/app/backend/data
    environment:
      # Points the WebUI to the Ollama service defined in the same compose file
      OLLAMA_BASE_URL: http://ollama:11434
      # Optional: Set a secret key for enhanced security
      # WEBUI_SECRET_KEY: "your_secret_key"
    # Ensure Ollama starts first
    command: ["/bin/sh", "-c", "sleep 5 && /app/backend/entrypoint.sh"]

volumes:
  ollama:
  openwebui: