version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - webui_data:/app/backend/data
    environment:
      # This environment variable tells Open WebUI how to connect to the Ollama service
      - OLLAMA_BASE_URL=http://ollama:11434 
      # Optional: Set a secret key for enhanced security
      # - WEBUI_SECRET_KEY=your_secure_secret_key
    depends_on:
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway" # Helps with connectivity on certain systems
    restart: unless-stopped

volumes:
  ollama_data:
  webui_data:
