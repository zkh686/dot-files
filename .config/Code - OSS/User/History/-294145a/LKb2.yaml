   version: '3.8'

    services:
      ollama:
        image: ollama/ollama:rocm # Use the ROCm-enabled image for AMD GPUs
        container_name: ollama
        restart: unless-stopped
        ports:
          - "11434:11434"
        volumes:
          - ollama_data:/root/.ollama
        devices:
          - /dev/kfd
          - /dev/dri # This grants access to the AMD GPU devices

      open-webui:
        image: ghcr.io/open-webui/open-webui:ollama
        container_name: open-webui
        restart: unless-stopped
        ports:
          - "8080:8080" # Or your preferred port
        volumes:
          - openwebui_data:/app/backend/data
        environment:
          - OLLAMA_API_BASE_URL=http://ollama:11434/api # Connects to the Ollama service

    volumes:
      ollama_data:
      openwebui_data: